readme = "README.md"
authors = [
    { name = "shawinCreates", email = "sabinneupane31@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.6",
